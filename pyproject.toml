[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heatsteal"
version = "0.1.0"
description = "Controller for a two-person Peltier heat-theft rig"
readme = "README.md"
requires-python = ">=3.11"
# Kept deliberately short: this runs on a Raspberry Pi 3.
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# Only install on the Pi. Nothing outside relays.py imports these.
pi = [
    "gpiozero",
    "lgpio",
]
test = [
    "pytest",
    "httpx",  # needed by fastapi.testclient
]

[project.scripts]
heatsteal = "heatsteal.cli:main"
heatsteal-service = "heatsteal.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heatsteal = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
