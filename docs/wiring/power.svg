 driven from the Pi header 5 V and are isolated from these contacts (see control.svg).</tspan><tspan x="-608.4" dy="9">• No common ground between the Pi and the 12 V side. NC contacts unused.</tspan><tspan x="-608.4" dy="9">• Overcurrent limit: the power bank's 12 V / 3 A PD contract. Expected draw ≈2.1 A.</tspan><tspan x="-608.4" dy="9">• TS1 is a hardware backstop; the software never relies on it.</tspan></text><circle cx="72" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="72" cy="432" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="712.8" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="712.8" cy="144" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="712.8" cy="252" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="712.8" cy="432" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="1008" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="1008" cy="144" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="1008" cy="252" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /><circle cx="1008" cy="432" r="2.7" style="stroke:black;fill:black;stroke-width:1.4;stroke-dasharray:-;" /></svg>